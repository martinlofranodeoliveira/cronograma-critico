[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cronograma-critico"
version = "1.0.0"
description = "Planejamento por caminho crítico (CPM) com relações FS/SS/FF/SF, folgas, feriados e Gantt SVG."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Martin Lofrano / LOFRANO TECNOLOGIA"}]
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
cronograma-critico = "cronograma_critico.cli:main"

[project.urls]
Homepage = "https://lofranotecnologia.com.br/"
Repository = "https://github.com/martinlofranodeoliveira/cronograma-critico"
Issues = "https://github.com/martinlofranodeoliveira/cronograma-critico/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["cronograma_critico"]
namespaces = false

[tool.setuptools.package-data]
cronograma_critico = ["data/*.json"]
